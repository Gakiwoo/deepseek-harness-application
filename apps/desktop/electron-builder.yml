appId: ai.deepseek.harness
productName: DeepSeek Harness
directories:
  output: dist
  buildResources: build
# The official DeepSeek whale glyph (RGB #4D6BFE): build/icon.icns (macOS),
# build/icon.ico (Windows), build/icon.png (Linux). electron-builder reads
# the platform file from buildResources automatically; the explicit win
# setting is a no-op fallback for older builders.
icon: build/icon
# The only Electron-ABI native dependency is node-pty, and it lives in
# resources/host, rebuilt for the Free Electron ABI by pack-desktop.ts step 4
# BEFORE electron-builder runs. electron-builder's own npmRebuild would
# re-rebuild it with a bundled node-gyp that cannot find Visual Studio 2026 on
# current windows-latest, so keep that automatic pass off.
npmRebuild: false
files:
  - out/main.js
  - out/main.js.map
  - out/preload.cjs
  - package.json
extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
    - target: zip
  artifactName: DeepSeek-Harness-${version}-mac-${arch}.${ext}
win:
  target:
    - nsis
    - zip
  artifactName: DeepSeek-Harness-${version}-win-x64.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
